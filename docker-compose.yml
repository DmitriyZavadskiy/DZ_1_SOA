services:
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:443/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
